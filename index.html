<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dearest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(22, 27, 34, 0.85);
            --surface-hover: rgba(30, 36, 46, 0.95);
            --border-color: rgba(212, 175, 55, 0.2);
            --border-hover: rgba(212, 175, 55, 0.4);
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
            --accent-gold: #d4af37;
            --accent-rose: #e25575;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #070913, #0b0f19, #121824);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 120px; /* Leaves space for the bottom music player */
        }

        /* WELCOME OVERLAY */
        .welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 9, 19, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .welcome-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 50px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .welcome-box h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .welcome-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            background: #0b0f19;
            text-align: center;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
        }

        .welcome-box button {
            background: var(--accent-gold);
            color: #0b0f19;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .welcome-box button:hover {
            background: #e6c55d;
        }

        .error-tip {
            color: #e25575;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }

        /* TOP STATUS BAR */
        .top-nav-bar {
            width: 90%;
            max-width: 840px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0 10px;
            z-index: 10;
        }

        .online-badge {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .online-dot {
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 40px 20px 50px;
            max-width: 800px;
            z-index: 2;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 300;
            color: var(--text-main);
        }

        header h1 span {
            font-style: italic;
            color: var(--accent-gold);
        }

        .container {
            max-width: 840px;
            width: 90%;
            margin: 0 auto;
            z-index: 2;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* COUNTDOWN */
        .countdown-card {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 45px 30px;
            text-align: center;
            margin-bottom: 70px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .countdown-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 30px;
            letter-spacing: 0.05em;
        }

        .timers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .time-box {
            padding: 10px;
            border-right: 1px solid var(--border-color);
        }

        .time-box:last-child { border-right: none; }

        .time-box span {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 300;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        .time-box label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            font-size: 2.4rem;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 0.03em;
        }

        /* TIMELINE */
        .timeline {
            position: relative;
            margin-bottom: 80px;
            padding-left: 30px;
            border-left: 1px solid var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -35.5px;
            top: 5px;
            width: 10px; height: 10px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        .timeline-date {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .timeline-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .timeline-content h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .timeline-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
            font-weight: 300;
        }

        /* WALL OF MEMORIES */
        .memories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 80px;
        }

        .polaroid {
            background: #1e2430;
            padding: 15px 15px 35px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            transform: rotate(-1deg);
            transition: var(--transition-smooth);
        }

        .polaroid:nth-child(even) { transform: rotate(1.5deg); }
        .polaroid:hover { transform: translateY(-8px) rotate(0deg); border-color: var(--accent-gold); }

        .polaroid-img {
            width: 100%;
            height: 220px;
            background: #0b0f19;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .polaroid-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid p {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-main);
            font-style: italic;
        }

        /* DISTANCE CARD */
        .distance-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 40px;
            text-align: center;
            margin-bottom: 80px;
            backdrop-filter: blur(10px);
        }

        .distance-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .distance-card p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        /* PROMISES */
        .promises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 80px;
        }

        .promise-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 35px 30px;
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
        }

        .promise-card:hover {
            border-color: var(--accent-gold);
            background: var(--surface-hover);
        }

        .promise-card span {
            font-family: 'Cormorant Garamond', serif;
            color: var(--accent-gold);
            font-size: 1.1rem;
            display: block;
            margin-bottom: 10px;
        }

        .promise-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .promise-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 300;
        }

        /* LOVE LETTER */
        .love-letter {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 60px 50px;
            margin-bottom: 80px;
            backdrop-filter: blur(10px);
        }

        .love-letter h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 40px;
        }

        .love-letter p {
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 300;
            font-family: 'Cormorant Garamond', serif;
        }

        .love-letter p.signature-text {
            text-align: right;
            margin-top: 40px;
            color: var(--accent-gold);
            font-style: italic;
            font-size: 1.2rem;
        }

        /* PROPOSAL SECTION */
        .proposal-section {
            text-align: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 60px 30px;
            position: relative;
            margin-bottom: 60px;
            backdrop-filter: blur(10px);
        }

        .proposal-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            align-items: center;
        }

        .btn {
            padding: 14px 36px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 1px solid var(--border-color);
            border-radius: 0;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-yes {
            background: var(--accent-gold);
            color: #0b0f19;
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
        }

        .btn-yes:hover {
            background: #e6c55d;
            transform: translateY(-2px);
        }

        .btn-no {
            background: transparent;
            color: var(--text-muted);
            position: absolute;
        }

        /* FLOATING BOTTOM MUSIC PLAYER BAR */
        .music-player-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 650px;
            background: rgba(22, 27, 34, 0.92);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .player-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .track-thumb {
            width: 48px; height: 48px;
            background: #0b0f19;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .track-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .track-details h4 {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .track-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .control-btn:hover { color: var(--accent-gold); }

        .play-pause-btn {
            width: 40px; height: 40px;
            background: var(--text-main);
            color: #0b0f19;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .play-pause-btn:hover { transform: scale(1.08); }

        .player-progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar-fill {
            width: 30%;
            height: 100%;
            background: var(--accent-gold);
        }

        .player-bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .playlist-dropdown-btn {
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 0.05em;
        }

    <!-- CELEBRATION SUCCESS POPUP -->
    <div class="success-overlay" id="successModal">
        <div class="success-box">
            <h2>Celebration! 🎉</h2>
            <p>You’ve chosen correctly. My world is permanently better with you in it. I love you endlessly!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <footer>
        Curated with endless love.
    </footer>

    <!-- Hidden audio element if you want to link a real MP3 file -->
    <audio id="audioPlayer" loop>
        <!-- Add your music link here: <source src="your-song.mp3" type="audio/mp3"> -->
    </audio>

    <script>
        // PASSCODE UNLOCK LOGIC
        function checkPasscode() {
            const input = document.getElementById('passcodeInput').value.trim();
            const correctCode = "20240101"; // CHANGE TO YOUR DATE/PASSCODE

            if (input === correctCode || input.toLowerCase() === "love") {
                document.getElementById('welcomeOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcomeOverlay').style.display = 'none';
                }, 800);
            } else {
                document.getElementById('errorTip').style.display = 'block';
            }
        }

        // SCROLL REVEAL OBSERVER
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // COUNTDOWN TIMER
        const countdownEl = document.getElementById('countdown');
        const startDate = new Date(countdownEl.getAttribute('data-start-date')).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = now - startDate;

            document.getElementById('days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // MUSIC PLAYER SIMULATION & CONTROLS
        let isPlaying = false;
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');

        const playlist = [
            { title: "Our Special Vibe", artist: "Forever Yours" },
            { title: "The Song We First Heard", artist: "Memory Lane" },
            { title: "All My Tomorrows", artist: "Dedicated To You" }
        ];
        let currentTrackIdx = 0;

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "⏸" : "▶";
            // If you add a real audio file source, call audioPlayer.play() or pause() here
        }

        function switchTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            trackTitle.innerText = playlist[currentTrackIdx].title;
            trackArtist.innerText = playlist[currentTrackIdx].artist;
            isPlaying = true;
            playBtn.innerText = "⏸";
        }

        function nextTrack() { switchTrack(); }
        function prevTrack() { switchTrack(); }

        // Simulated progress movement
        let progress = 30;
        setInterval(() => {
            if (isPlaying) {
                progress = (progress + 1) % 100;
                progressFill.style.width = progress + "%";
            }
        }, 1000);

        // MOVING NO BUTTON
        const noBtn = document.getElementById('noBtn');
        function moveButton() {
            const x = Math.random() * (window.innerWidth - 180);
            const y = Math.random() * (window.innerHeight - 120);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(20, x)}px`;
            noBtn.style.top = `${Math.max(20, y)}px`;
        }

        // CELEBRATION SUCCESS POPUP
        function sayYes() {
            document.getElementById('successModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }
    </script>
</body>
</html>
